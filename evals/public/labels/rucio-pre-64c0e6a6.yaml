  status: gated
  evidence: "GHSA-5j9r-fx4x-rpvg (CVE-2026-58273): SignURL.get() takes the authorization principal from the client-supplied X-Rucio-Account header (line 165; VO from X-Rucio-VO via extract_vo at 164) instead of request.environ['issuer'] set from the validated token, and passes it to get_signed_url(account, ...) (line 194), whose permission check perm_get_signed_url is _is_root(issuer). Any holder of a valid low-privilege token can send X-Rucio-Account: root and have the server mint presigned read/write/delete URLs for arbitrary objects with the RSE's stored S3/GCS/Swift credentials. Gated: needs any valid auth token and a cloud-backed RSE."
