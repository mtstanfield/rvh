  evidence: "completed() base64-decodes the token request parameter into an ObjectInputStream and calls readObject() (line 45) before any type check, so a crafted stream runs whatever readObject gadgets are on the classpath; the bundled org.dummy.insecure.framework.VulnerableTaskHolder passes its taskAction to Runtime.exec (limited there to short sleep/ping commands). Gated: lesson endpoints need a (self-registered) WebGoat login."
