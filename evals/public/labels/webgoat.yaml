  evidence: "registerNewUser concatenates the username_reg parameter into the existence-check query (line 60) and runs it with Statement.executeQuery (line 62); the differing user-exists / user-created responses make it a boolean blind injection, e.g. tom' AND substring(password,1,1)='a, that recovers tom's password. Gated: lesson endpoints need a (self-registered) WebGoat login."
